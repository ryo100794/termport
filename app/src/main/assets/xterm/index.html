  else { if (panes[activePane]) panes[activePane].lastActiveAt = Date.now(); panes.forEach((_, i) => document.getElementById("pane" + i).classList.toggle("active", activePane === i)); refreshSessions(); updatePaneTitles(); }
  if (persist) saveLayout();
  relayout('split');
  requestAnimationFrame(() => relayout('split-frame'));
  setTimeout(() => relayout('split-settled'), RESIZE_SLOW_DELAY_MS);
}
function nextSplitCount() { return splitCount === 1 ? 2 : splitCount === 2 ? 4 : 1; }
document.getElementById('split').onclick = () => applySplitState(nextSplitCount(), true);
document.getElementById('redraw').onclick = () => { try { active().term.refresh(); } catch (_) {} relayout('redraw'); };
const skydnirEditor = document.getElementById('skydnirEditor');
const skydnirDockerfile = document.getElementById('skydnirDockerfile');
const skydnirCompose = document.getElementById('skydnirCompose');
function closeSkydnirEditor() {
  skydnirEditor.classList.remove('open');
  refocusActiveSoon();
}
function editSkydnirProject() {
  try { closeSkydnirImagesPanel(); } catch (_) {}
  let payload = {};
  try { payload = JSON.parse(Android.loadSkydnirProjectFiles() || '{}'); } catch (_) {}
  skydnirDockerfile.value = payload.dockerfile || '';
  skydnirCompose.value = payload.compose || '';
  skydnirEditor.classList.add('open');
  skydnirCompose.focus();
}
document.getElementById('skydnirEditorClose').onclick = closeSkydnirEditor;
document.getElementById('skydnirEditorSave').onclick = () => {
  try {
    if (Android.saveSkydnirProjectFiles(skydnirDockerfile.value, skydnirCompose.value)) { setStatus('Skydnir project saved'); closeSkydnirEditor(); }
    else setStatus('Skydnir project save failed');
  } catch (_) { setStatus('Skydnir project save failed'); }
};
function buildSkydnirProject(source) {
  setDockerBarOpen(false);
  try { Android.buildSkydnirProject(skydnirActionSession(source)); } catch (_) { setStatus('Skydnir build failed'); }
}
function runSkydnirProject(source) {
  setDockerBarOpen(false);
  try { Android.runSkydnirProject(skydnirActionSession(source)); } catch (_) { setStatus('Skydnir run failed'); }
}
function connectSkydnirProject(source) {
  setDockerBarOpen(false);
  const s = skydnirActionSession(source);
  updateSessionTitle(s, { backend:'Skydnir', target:dockerEndpoint(), state:'connecting' });
  try { Android.connectSkydnir(s); } catch (_) { setStatus('Skydnir connect failed'); }
}
document.getElementById("connect").onclick = () => { const s = active().session; updateSessionTitle(s, { backend:"Termux", target:defaultTermuxTarget(s), state:"connecting" }); Android.connectSession(s); };
function setSkydnirActionsOpen(open, paneIndex=activePane) {
  const enabled = !!open;
  if (enabled) setSkydnirMenuPane(paneIndex);
  else setSkydnirMenuPane(-1);
  document.body.classList.toggle('skydnirActions', enabled);
  document.getElementById('skydnir').classList.toggle('active', enabled);
  relayout('skydnir-actions');
}
document.getElementById('skydnir').onclick = () => setSkydnirActionsOpen(!document.body.classList.contains('skydnirActions'), activePane);
document.querySelectorAll('.skydnirConnect').forEach(b => b.onclick = ev => connectSkydnirProject(ev));
document.querySelectorAll('.skydnirEdit').forEach(b => b.onclick = editSkydnirProject);
document.querySelectorAll('.skydnirBuild').forEach(b => b.onclick = ev => buildSkydnirProject(ev));
document.querySelectorAll('.skydnirRun').forEach(b => b.onclick = ev => runSkydnirProject(ev));
document.querySelectorAll('.skydnirList').forEach(b => b.onclick = () => { if (dockerBarOpen && dockerBarMode === 'containers') setDockerBarOpen(false); else requestDockerContainers(); });
document.querySelectorAll('.skydnirImages').forEach(b => b.onclick = () => { if (dockerBarOpen && dockerBarMode === 'images') setDockerBarOpen(false); else requestDockerImages(); });
window.termportDebug = {
  setSplit:n => applySplitState(n, true),
  setActivePane:i => setActivePane(i),
  openSkydnirForPane:i => setSkydnirActionsOpen(true, i),
  closeSkydnir:() => setSkydnirActionsOpen(false),
  menuPane:() => skydnirActionsPane,
  menuSession:() => skydnirMenuSession(),
  actionSession:paneIndex => skydnirActionSession(paneIndex),
  state:() => ({ activePane, skydnirActionsPane, menuSession:skydnirMenuSession(), dockerBarOpen, dockerBarMode, editorOpen:skydnirEditor.classList.contains('open'), imagesOpen:skydnirImagesPanel.classList.contains('open') }),
  edit:() => editSkydnirProject(),
  build:paneIndex => buildSkydnirProject(paneIndex),
  run:paneIndex => runSkydnirProject(paneIndex),
  connect:paneIndex => connectSkydnirProject(paneIndex),
  list:() => requestDockerContainers(),
  images:() => requestDockerImages(),
  fontMetrics:() => panes.map((p, i) => Object.assign({ pane:i, visible:isPaneVisible(i), active:i === activePane }, p.term && p.term.fontMetrics ? p.term.fontMetrics() : {})),
  debugFontMetrics:(sizes=[7,6,5]) => {
    const original = fontSize;
    const out = [];
    for (const value of sizes) {
      fontSize = clampFontSize(Number(value));
      fitAll('debug-font', false, false);
      const term = active().term;
      out.push(Object.assign({ requested:Number(value), fontSize }, term && term.fontMetrics ? term.fontMetrics() : {}));
    }
    fontSize = original;
    fitAll('debug-font-restore', false, false);
    return out;
  },
  imageFiles:() => renderImageFilesRoot(),
  openImageFiles:(image, path='/') => openImageFiles(image, path),
  renderImages:payload => window.setDockerImages(payload || {}),
  renderImageFiles:payload => renderImageFiles(payload || {}),
  renderImageFilePreview:payload => renderImageFilePreview(payload || {}),
  imageLabels:() => [...skydnirImagesBody.querySelectorAll('.imageRowTitle,.imageWidgetValue,.imageMessage,.imageFileName,.imageFileDetail,.imagePath,button')].map(b => b.textContent)
};
setTimeout(() => {
  const saved = loadLayout();
  if (typeof saved.splitCount === 'number') splitCount = saved.splitCount;
  else if (typeof saved.split === 'boolean') splitCount = saved.split ? 2 : 1;
  split = splitCount > 1;
  if (typeof saved.fontSize === 'number') fontSize = clampFontSize(saved.fontSize);
  autoYesProceed = saved.autoYesProceed === true;
  refreshAutoYesButton();
  restoringInitialLayout = true;
  applySplitState(splitCount, false);
  if (Array.isArray(saved.sessions)) {
    for (let i=0; i<Math.min(saved.sessions.length, panes.length); i++) {
      const target = Math.max(0, Math.min(SESSION_COUNT - 1, Number(saved.sessions[i]) || 0));
      resetPaneForSession(i, target);
    }
  }
  const pane = Math.max(0, Math.min(visiblePaneCount() - 1, Number(saved.activePane) || 0));
  relayout('init', [], 'cursor', true, false);
  setActivePane(pane);
  setTimeout(() => { restoringInitialLayout = false; rememberVisiblePaneViews(); saveLayout(); }, 900);
}, 350);
</script>
</body>
</html>
