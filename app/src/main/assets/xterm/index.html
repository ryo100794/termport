function refreshSessions() { for (const [i,b] of [...sessions.children].entries()) b.classList.toggle('active', i === active().session); }
for (let i=0; i<SESSION_COUNT; i++) { const b=document.createElement('button'); b.textContent='S'+(i+1); b.onclick=()=>switchPaneSession(activePane, i, true); sessions.appendChild(b); }
refreshSessions();
function refreshModeButton() { const b = document.getElementById('mode'); b.textContent = rendererMode === 'safe' ? 'Xterm' : 'Buffer'; b.classList.toggle('active', rendererMode === 'buffer'); }
document.getElementById('mode').onclick = () => { rendererMode = rendererMode === 'safe' ? 'buffer' : 'safe'; saveLayout(); location.reload(); };
refreshModeButton();
function refreshSplitButton() {
  const b = document.getElementById('split');
  b.textContent = splitCount === 4 ? 'Split 4' : splitCount === 2 ? 'Split 2' : 'Split 1';
  b.classList.toggle('active', splitCount > 1);
}
function applySplitState(countOrEnabled, persist=true) {
  rememberVisiblePaneViews();
  splitCount = countOrEnabled === true ? 2 : countOrEnabled === false ? 1 : Number(countOrEnabled) || 1;
  if (![1, 2, 4].includes(splitCount)) splitCount = splitCount > 2 ? 4 : splitCount > 1 ? 2 : 1;
  split = splitCount > 1;
  document.body.classList.toggle('single', splitCount === 1);
  document.body.classList.toggle('split2', splitCount === 2);
  document.body.classList.toggle('split4', splitCount === 4);
  refreshSplitButton();
  if (!isPaneVisible(activePane)) setActivePane(0);
  else { panes.forEach((_, i) => document.getElementById('pane' + i).classList.toggle('active', activePane === i)); refreshSessions(); }
  if (persist) saveLayout();
  relayout('split');
  requestAnimationFrame(() => relayout('split-frame'));
  setTimeout(() => relayout('split-settled'), RESIZE_SLOW_DELAY_MS);
}
function nextSplitCount() { return splitCount === 1 ? 2 : splitCount === 2 ? 4 : 1; }
document.getElementById('split').onclick = () => applySplitState(nextSplitCount(), true);
document.getElementById('redraw').onclick = () => { try { active().term.refresh(); } catch (_) {} relayout('redraw'); };
document.getElementById('connect').onclick = () => Android.connectSession(active().session);
document.getElementById('setup').onclick = () => {
  try { Android.copyTermuxSetup(); } catch (_) {}
  try { Android.openTermux(); } catch (_) {}
};
document.getElementById('skydnir').onclick = () => { if (dockerBarOpen) setDockerBarOpen(false); else requestDockerContainers(); };
setTimeout(() => {
  const saved = loadLayout();
  if (typeof saved.splitCount === 'number') splitCount = saved.splitCount;
  else if (typeof saved.split === 'boolean') splitCount = saved.split ? 2 : 1;
  split = splitCount > 1;
  if (saved.rendererMode === 'safe' || saved.rendererMode === 'buffer') rendererMode = saved.rendererMode;
  refreshModeButton();
  if (typeof saved.fontSize === 'number') fontSize = clampFontSize(saved.fontSize);
  if (saved.viewStates && typeof saved.viewStates === 'object') Object.assign(sessionViewStates, saved.viewStates);
  applySplitState(splitCount, false);
  if (Array.isArray(saved.sessions)) {
    for (let i=0; i<Math.min(saved.sessions.length, panes.length); i++) {
      const target = Math.max(0, Math.min(SESSION_COUNT - 1, Number(saved.sessions[i]) || 0));
      resetPaneForSession(i, target);
    }
  }
  const pane = Math.max(0, Math.min(visiblePaneCount() - 1, Number(saved.activePane) || 0));
  relayout('init');
  for (const p of panes) Android.connectSession(p.session);
  setActivePane(pane);
}, 350);
</script>
</body>
